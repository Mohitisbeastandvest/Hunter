name: Build Hunter Plugin

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Hunter
        run: mvn -B clean package

      - name: Upload Hunter JAR
        uses: actions/upload-artifact@v4
        with:
          name: Hunter-Plugin
          path: target/*.jar
